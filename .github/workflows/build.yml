name: Compilar App
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Ensamblar y compilar
        run: |
          flutter create app_generada
          cp frontend/pubspec.yaml app_generada/pubspec.yaml
          mkdir -p app_generada/lib
          cp frontend/lib/main.dart app_generada/lib/main.dart
          cd app_generada
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: APK-ViaLibre
          path: app_generada/build/app/outputs/flutter-apk/app-release.apk
